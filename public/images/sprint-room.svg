    <text x="20" y="35" text-anchor="middle" fill="white" font-family="Arial" font-size="10" font-weight="bold">B</text>
    <text x="45" y="25" font-family="Arial, sans-serif" font-size="11" fill="#ff6b35" font-weight="bold">Bob</text>
    <text x="45" y="42" font-family="Arial, sans-serif" font-size="10" fill="#aaa">Reviewing PR #7</text>
  </g>
  <g transform="translate(90, 200)">
    <rect x="0" y="0" width="230" height="60" rx="12" fill="#3d3d54"/>
