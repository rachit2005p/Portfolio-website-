    <text x="20" y="35" text-anchor="middle" fill="white" font-family="Arial" font-size="10" font-weight="bold">C</text>
    <text x="45" y="25" font-family="Arial, sans-serif" font-size="11" fill="#4a90d9" font-weight="bold">Carol</text>
    <text x="45" y="42" font-family="Arial, sans-serif" font-size="10" fill="#aaa">Tests passing ✅</text>
  </g>
  <g transform="translate(320, 210)">
    <rect x="0" y="0" width="180" height="50" rx="12" fill="#3d3d54"/>
    <circle cx="20" cy="25" r="16" fill="url(#bubble1)"/>
    <text x="20" y="30" text-anchor="middle" fill="white" font-family="Arial" font-size="10" font-weight="bold">D</text>
    <text x="45" y="22" font-family="Arial, sans-serif" font-size="11" fill="#4ecdc4" font-weight="bold">Dave</text>
