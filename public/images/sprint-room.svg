  <text x="300" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#4ecdc4">Sprint Room</text>
  <text x="300" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#888">No data saved. Complete privacy.</text>
