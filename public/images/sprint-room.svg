<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="bubble1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4ecdc4"/>
      <stop offset="100%" stop-color="#44b3ab"/>
    </linearGradient>
    <linearGradient id="bubble2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff6b35"/>
      <stop offset="100%" stop-color="#e55a2b"/>
    </linearGradient>
    <linearGradient id="bubble3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4a90d9"/>
      <stop offset="100%" stop-color="#357abd"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <g transform="translate(50, 40)">
    <rect x="0" y="0" width="500" height="280" rx="16" fill="#2d2d44" stroke="#3d3d54" stroke-width="1.5"/>
    <rect x="0" y="0" width="500" height="40" rx="16" fill="#3d3d54"/>
    <rect x="0" y="20" width="500" height="20" fill="#3d3d54"/>
    <circle cx="20" cy="20" r="6" fill="#ff4d4d"/>
    <circle cx="40" cy="20" r="6" fill="#ffcc00"/>
